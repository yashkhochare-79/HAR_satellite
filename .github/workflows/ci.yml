name: CI & Docker Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 espeak
          python -m pip install --upgrade pip
          pip install -r har_prototype/requirements.txt

      - name: Run Smoke Tests
        run: |
          cd har_prototype
          python sequence_validator.py
          python action_recognizer.py
          python logger.py
